name: Booking monitoring
on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      test_notifications:
        description: Run an isolated simulated outage and recovery notification test
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: booking-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test monitor.test.mjs
      - run: node hosted.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEST_NOTIFICATIONS: ${{ inputs.test_notifications }}
